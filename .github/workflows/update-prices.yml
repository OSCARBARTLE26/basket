name: Update prices

# Runs once a month (05:17 UTC on the 1st) and whenever you press "Run workflow".
# Each run costs about $2.10 of Apify credit, so the free $5 a month covers it.
on:
  schedule:
    - cron: '17 5 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch supermarket prices
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node scripts/fetch-prices.mjs

      - name: Save new prices
        run: |
          git config user.name "basket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "Prices unchanged."
          else
            git commit -m "Update supermarket prices"
            git push
          fi

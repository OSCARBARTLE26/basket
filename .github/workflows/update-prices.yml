name: Update prices

# Runs once a month (05:17 UTC on the 20th, just after your Apify credit resets)
# and whenever you press "Run workflow".
# A full run searches 137 ingredients and costs about $2.50-$3.25 of Apify credit,
# capped at $4, so the free $5 a month covers it.
# Tick "Only missing items" for a cheap top-up run (new recipes or gaps).
on:
  schedule:
    - cron: '17 5 20 * *'
  workflow_dispatch:
    inputs:
      only_missing:
        description: 'Only missing items (cheap top-up)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch supermarket prices
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          ONLY_MISSING: ${{ inputs.only_missing && '1' || '0' }}
        run: node scripts/fetch-prices.mjs

      - name: Save new prices
        run: |
          git config user.name "basket-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/unmatched.json
          if git diff --cached --quiet; then
            echo "Prices unchanged."
          else
            git commit -m "Update supermarket prices"
            git push
          fi
